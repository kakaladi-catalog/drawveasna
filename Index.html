<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="icon.png" type="image/png">
    <meta charset="UTF-8">
    <title>Style UI</title>
    <link rel="stylesheet" href="css/style_Modern.css"> <!-- Link to the CSS file -->
    <audio id="ambientSound" loop>
        <source src="audio/beats.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
    <audio id="transitionSound">
        <source src="audio/beats.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
</head>
 <body><!-- The body of the HTML document -->
    <h1>"</h1>
    <p>"</p>
    <!-- Go to Top Button -->
    <button id="goToTopBtn" title="Go to Top">↑</button>
  <div class="container"> 
   <div class="header">
    <div class="choose-stayle">
     <!-- Checkbox to toggle containers -->

        <span class="slstyle">Select a style 👉</span>
        <div class="selects" id="dynamicSelects"></div>
                <!-- Style select will be dynamically added here -->
            </div>
        </div>
        <div class="grid-container">
            <!-- First Grid Item -->
            <div class="grid-item">
                <div class="card">
                    <div class="Website">
                        <div class="text-sm">
                            Website :
                            <a class="Copilot" href="#">Copilot</a>
                        </div>
                        <div class="Group">
                            Group :
                            <a class="Telegram" href="#">Telegram</a>
                        </div>
                        <div class="Donate-me">
                            Donate me :
                            <a class="QR-Code" href="#">QR Code</a>
                        </div>
                    </div>
     
                     <!-- Image Container -->
                     <div id="imageContainer">
                        <!-- This is where the image will be appended -->
                    </div>
                </div>
            </div>
             <!-- Second Grid Item -->
             <div class="grid-item">
                <div class="card">
                    <div class="theader-card">
                        <input type="text" placeholder="បញ្ចូលពាក្យបញ្ជាររបស់អ្នក" class="input-text" id="dogInput" oninput="updateText()">
                    </div>
                    <div id="container">
                        <!-- This is where the checkboxes and selects will be appended -->
                    </div>
                </div>

                <!-- Generate Section -->
                <div class="Generate">
                    <span class="text-sm generate-text">Generate On Copilot 👇</span>
                </div>
                <!-- Dynamic Text and Copy Button -->
                <div class="mt-2">
                    <p class="formprompt" id="copyText">
                        <span id="dynamicText"></span>
                    </p>
                    <button class="copy-button" onclick="copyToClipboard()">Copy Text</button>
                    <label class="checkbox-label">
                        <input type="checkbox" id="toggleContainer"> Show Prompts 
                    </label>
                </div>
            </div>
        </div>
        <!-- Container 2 -->
        <div class="container2">
            <table class="custom-table">
                <!-- This is where the checkboxes and selects will be appended -->
            </table>
        </div>
        <!-- Container 3 -->
        <div class="container3" style="display: none;">
            <div>
                <input type="text" class="searchBox" id="searchBox" placeholder="Search by Style Name or Prompt" />
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-300" id="container3Table">
                    <!-- Table content will be dynamically added here -->
                </table>
            </div>
        </div>
  <script src="js/scripts.js"></script> <!-- Link to the JS file -->
  <script src="js/Prompt.js"></script> <!-- Link to the JS file -->
 </body>
</html>
